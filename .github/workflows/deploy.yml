name: Build and deploy backend

on:
    push:
        branches: [main]

concurrency:
    group: meal-planner-production
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
            - name: Reject stale main tip
              run: |
                  git fetch origin main
                  test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run check
            - run: npm run openapi
            - run: git diff --exit-code -- contracts/openapi.json
            - run: npm run audit:dependencies

    image:
        needs: quality
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            reference: ${{ steps.reference.outputs.value }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
            - name: Reject stale main tip before image build
              run: |
                  git fetch origin main
                  test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: image-name
              shell: bash
              run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
            - id: build
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.image-name.outputs.value }}:sha-${{ github.sha }}
                  cache-from: type=gha,scope=meal-backend
                  cache-to: type=gha,mode=max,scope=meal-backend
                  provenance: mode=max
                  sbom: true
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ github.sha }}
            - id: reference
              shell: bash
              env:
                  IMAGE_NAME: ${{ steps.image-name.outputs.value }}
                  IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
              run: echo "value=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

    deploy:
        needs: image
        runs-on: ubuntu-latest
        environment: test
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
            - name: Reject stale main tip before deploy
              run: |
                  git fetch origin main
                  test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            - name: Configure pinned SSH identity
              shell: bash
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  install -d -m 700 "$HOME/.ssh"
                  printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
                  chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
            - name: Deploy immutable backend image
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  BACKEND_IMAGE: ${{ needs.image.outputs.reference }}
                  REVISION: ${{ github.sha }}
              run: |
                  case "$BACKEND_IMAGE" in
                    *@sha256:*) ;;
                    *) echo "Expected immutable image digest" >&2; exit 64 ;;
                  esac
                  ssh -o BatchMode=yes -o IdentitiesOnly=yes \
                    "$DEPLOY_USER@$DEPLOY_HOST" \
                    "sudo -n /usr/local/sbin/meal-deploy backend '$BACKEND_IMAGE' '$REVISION'"
