services:
    ai-worker:
        image: ${BACKEND_IMAGE:?immutable backend digest reference is required}
        profiles: [ai-worker]
        init: true
        user: node
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        pids_limit: 64
        mem_limit: 512m
        cpus: 1.0
        restart: unless-stopped
        group_add: ['${MEAL_SECRETS_GID:-29001}']
        environment:
            NODE_ENV: production
            DATABASE_URL_FILE: /run/secrets/ai_worker_database_url
            AI_API_TOKEN_FILE: /run/secrets/ai_api_token
            AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1/}
            AI_MODEL: ${AI_MODEL:-gpt-6-luna}
            AI_PROVIDER_PROFILE_VERSION: ${AI_PROVIDER_PROFILE_VERSION:-openai-gpt-6-luna-standard-2026-11-07}
            AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-}
            AI_WORKER_OWNER_ID: ${AI_WORKER_OWNER_ID:-ai-worker-primary}
            AI_WORKER_BATCH_SIZE: ${AI_WORKER_BATCH_SIZE:-5}
            AI_WORKER_POLL_MS: ${AI_WORKER_POLL_MS:-2000}
            AI_WORKER_PROVIDER_POLL_MS: ${AI_WORKER_PROVIDER_POLL_MS:-2000}
            AI_WORKER_LEASE_SECONDS: ${AI_WORKER_LEASE_SECONDS:-180}
        secrets: [ai_worker_database_url, ai_api_token]
        tmpfs:
            - '/tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0700,size=8m'
            - '/run/meal-ai-worker:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0700,size=2m'
        healthcheck:
            test: [CMD, node, scripts/check-ai-worker-health.mjs]
            interval: 15s
            timeout: 3s
            retries: 4
            start_period: 20s
        networks: [meal-db, meal-egress]
        command: [node, scripts/run-ai-worker.mjs]

secrets:
    ai_worker_database_url:
        file: ${AI_WORKER_DATABASE_URL_FILE:-/etc/meal-planner/secrets/ai-worker-database-url}
    ai_api_token:
        file: ${AI_API_TOKEN_FILE:-/etc/meal-planner/secrets/ai-api-token}
